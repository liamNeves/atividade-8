<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Aurora </title>
    <style>
        header {
            position: relative;
            width: auto;
            height: 56px;
            color: #c2ecff;
            background: #0047b6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            padding-left: 20px;
        }
        
        .buscar {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            background: #c2ecff;
            border-radius: 10px;
            border: 3px solid black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: -webkit-fill-available;
            padding: 12px;
            border: 1px solid black;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #0047b6;
            box-shadow: 0 0 0 4px rgba(0, 71, 182, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
            color: black;
            border: 1px solid black;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #142136;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .card {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h2 {
            margin-top: 0;
            color: #0047b6;
        }
        .card p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <header>
        <h2>LOJA AURORA</h2>
    </header>

    <div class="buscar">
        <div class="input-group">
            <input type="text" id="cep" name="cep" placeholder="Digite seu CEP :">
            <button onclick="buscarcep()">Buscar</button>
        </div>
        

        <div id="card_area"></div>
    </div>

    <script>
        async function buscarcep() {
            const cep = document.querySelector('#cep').value.replace(/\D/g, ''); // Remove letras ou traços
            const cardArea = document.querySelector('#card_area');
            
          
            cardArea.innerHTML = '';

            if (cep.length !== 8) {
                alert('Por favor, digite um CEP válido com 8 dígitos.');
                return;
            }

            try {
                
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const dados = await response.json();

                if (dados.erro) {
                    alert('CEP não encontrado.');
                    return;
                }

             
                cardArea.innerHTML = `
                    <div class="card">
                        <h2>CEP: ${dados.cep}</h2>
                        <p><strong>Logradouro:</strong> ${dados.logradouro || 'N/A'}</p>
                        <p><strong>Complemento:</strong> ${dados.complemento || 'N/A'}</p>
                        <p><strong>Bairro:</strong> ${dados.bairro || 'N/A'}</p>
                        <p><strong>Cidade:</strong> ${dados.localidade}</p>
                        <p><strong>Estado:</strong> ${dados.uf}</p>
                    </div>
                `;

            } catch (error) {
                console.error('Erro ao buscar o CEP:', error);
                alert('Erro de conexão ao buscar o CEP.');
            }
        }
    </script>
</body>
</html>
